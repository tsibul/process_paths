[project]
name = "process_paths"
version = "0.1.0"
description = "Digitizing paths: entities, state axes, transition kinds and linear variants"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.12",
]

[project.scripts]
measure-twice = "measure_twice.cli:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22",
    "pytest>=9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
